name: Publish v1.1.3

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-v1.1.3
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TAG: v1.1.3
      VERSION: 1.1.3
      RELEASE_SHA: 0bac8af3e80db45ee7940c1c798be2c012e0ed78
      ARCHIVE: CodexUsageWatcher-v1.1.3.zip

    steps:
      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the validated release commit
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify release target
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(tr -d '\r\n' < VERSION.txt)" = "$VERSION"

      - name: Build source archive and checksum
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          git archive \
            --format=zip \
            --prefix="CodexUsageWatcher-v${VERSION}/" \
            --output="$ARCHIVE" \
            "$RELEASE_SHA"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Codex Usage Watcher v1.1.3 is a follow-up bug-fix release for reset-time notification spam.

          Fixed:
          - Treats >=99.5% used, <=0.5% remaining, or a server-reported limit state as effectively exhausted.
          - Suppresses `RESET_TIME_CHANGED` while a window is effectively exhausted, including near-100 floating-point values that may be displayed as 100%.
          - Adds a second suppression guard in the notification layer.

          Diagnostics:
          - `status.bat` now displays the watcher version and install folder, making stale or duplicate installations easier to identify.

          Validation:
          - Added regression tests for near-100 usage values and explicit server limit states.
          - GitHub-hosted Windows runners passed the full suite on Node.js 22.x and 24.x before release.

          This is an unofficial community project and is not an OpenAI product or an OpenAI-endorsed project.
          EOF

          gh release create "$TAG" \
            "$ARCHIVE" \
            "${ARCHIVE}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Codex Usage Watcher v1.1.3" \
            --notes-file release-notes.md
