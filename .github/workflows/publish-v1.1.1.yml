name: Publish v1.1.1

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-v1.1.1
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TAG: v1.1.1
      VERSION: 1.1.1
      RELEASE_SHA: 5c8ca20e622a22caa1c421fa84a11988ed633914
      ARCHIVE: CodexUsageWatcher-v1.1.1.zip

    steps:
      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the validated release commit
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify release target
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(tr -d '\r\n' < VERSION.txt)" = "$VERSION"

      - name: Build source archive and checksum
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          git archive \
            --format=zip \
            --prefix="CodexUsageWatcher-v${VERSION}/" \
            --output="$ARCHIVE" \
            "$RELEASE_SHA"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Codex Usage Watcher v1.1.1 is the initial public open-source release.

          Highlights:
          - Monitors Codex ChatGPT rate-limit usage through the documented local `codex app-server` interface.
          - Detects usage resets, reset-time changes, low remaining usage, limit exhaustion, recovery, and Reset Credit changes.
          - Supports Windows notifications and optional SMTP email notifications.
          - Keeps user configuration, runtime history, logs, and environment files out of Git by default.
          - Includes PID start-time verification to reduce stale-PID process termination risk.
          - Includes automated normalization/detection tests and a mock app-server integration test.

          Validation:
          - GitHub-hosted Windows runners passed the test suite on Node.js 22.x and 24.x before release.

          Requirements:
          - Windows 10 or 11
          - Node.js 22 or 24 LTS
          - Codex CLI signed in with an authentication mode that exposes ChatGPT rate-limit data

          This is an unofficial community project and is not an OpenAI product or an OpenAI-endorsed project.
          EOF

          gh release create "$TAG" \
            "$ARCHIVE" \
            "${ARCHIVE}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Codex Usage Watcher v1.1.1" \
            --notes-file release-notes.md
