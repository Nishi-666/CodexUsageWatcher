name: Publish v1.1.2

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-v1.1.2
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      TAG: v1.1.2
      VERSION: 1.1.2
      RELEASE_SHA: ab06631af5249b440e6519c8e9453d0bfef057a9
      ARCHIVE: CodexUsageWatcher-v1.1.2.zip

    steps:
      - name: Check whether the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the validated release commit
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify release target
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(tr -d '\r\n' < VERSION.txt)" = "$VERSION"

      - name: Build source archive and checksum
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          git archive \
            --format=zip \
            --prefix="CodexUsageWatcher-v${VERSION}/" \
            --output="$ARCHIVE" \
            "$RELEASE_SHA"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          Codex Usage Watcher v1.1.2 is a bug-fix release.

          Fixed:
          - Stops repeated `RESET_TIME_CHANGED` notifications while a Codex usage window remains at 100% used.
          - Codex may move `resetsAt` while refreshing an exhausted limit state; those movements are now ignored until usage actually recovers.
          - Real recovery from 100% still produces the normal reset detection (`NORMAL_RESET` / `EARLY_RESET`).

          Validation:
          - Added regression tests for repeated 60-second exhausted polls and recovery from 100% usage.
          - GitHub-hosted Windows runners passed the full test suite on Node.js 22.x and 24.x before release.

          This is an unofficial community project and is not an OpenAI product or an OpenAI-endorsed project.
          EOF

          gh release create "$TAG" \
            "$ARCHIVE" \
            "${ARCHIVE}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Codex Usage Watcher v1.1.2" \
            --notes-file release-notes.md
