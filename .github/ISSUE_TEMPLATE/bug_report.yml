name: Bug report
description: Report a reproducible problem in Codex Usage Watcher
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not paste credentials, tokens, cookies, or unreviewed log files.**
        Local logs can contain usernames, file paths, plan information, and diagnostic text.
  - type: input
    id: watcher-version
    attributes:
      label: Watcher version
      placeholder: 1.1.1
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      description: Output of `codex --version`
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostic output
      description: Paste only the minimum relevant lines after removing personal paths, email addresses, and secrets.
      render: text
